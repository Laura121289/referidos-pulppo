<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beneficios · Pulppo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&display=swap">
<link rel="stylesheet" href="/ds/colors_and_type.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="barra">
  <div class="barra-in">
    <button type="button" class="marca" id="marca" title="Inicio">Beneficios</button>
    <nav class="programas" id="programas" aria-label="Programas" hidden></nav>
    <div class="sesion" id="sesion" hidden><span id="quien"></span><button type="button" class="link" id="salir">Salir</button></div>
    <img class="logo" src="/ds/assets/pulppo-symbol-black.png" alt="Pulppo">
  </div>
  <div class="barra-in sub" id="sub"><nav class="tabs" id="tabs" hidden></nav></div>
</header>

<main id="app" class="pagina">
  <p class="muted">Cargando…</p>
</main>

<section id="login" class="pagina" hidden>
  <p class="eyebrow">Beneficios Pulppo</p>
  <h1>Tus beneficios: Programa Referidos y Bono 1·5·10</h1>
  <p class="body muted">Consulta lo que tienes por cobrar, sube tu factura y sigue su estado hasta el pago.</p>
  <div class="acento"></div>
  <div class="login-cajas">
    <div class="caja">
      <h3>Con tu cuenta de Pulppo</h3>
      <a class="btn" id="sso-btn" hidden>Entrar con Pulppo</a>
      <p class="nota" id="sin-sso" hidden>El acceso aún no está configurado.</p>
    </div>
  </div>
  <p class="nota error" id="login-error" hidden></p>
  <form class="caja local" id="form-local" hidden>
    <h3>Uso local</h3>
    <label class="campo"><span class="tag">Entrar como (correo)</span><input id="correo-local" type="email" required></label>
    <button type="submit" class="btn btn-sec">Entrar</button>
  </form>
</section>

<dialog id="dlg" class="dialogo"></dialog>
<!--CONFIG-->
<script src="/static/app.js"></script>
</body>
</html>
